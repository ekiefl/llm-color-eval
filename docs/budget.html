<title>Word budget vs score</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #fff; color: #0b0b0b; font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 10px; }
  #wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; min-height: 585px; }
  .tick { font-size: 16px; fill: #52514e; font-family: system-ui, sans-serif; }
  svg { width: 100%; height: auto; display: block; }
  .hit { cursor: pointer; }
  #legend { display: flex; gap: 18px; font-size: 13px; color: #52514e; padding: 0 0 4px 60px; }
  .key { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #panel { border: 1px solid #d5d4d0; border-radius: 10px; padding: 12px 16px; margin-top: 6px; flex: 1; min-height: 150px; overflow-y: auto; scrollbar-width: thin; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: #c9c8c4; border-radius: 4px; }
  #scroll-more { color: #52514e; font-size: 12px; }
  #panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: #52514e; }
  #panel-head .chip { width: 20px; height: 20px; border-radius: 5px; background: #95eabf; }
  #panel-head b { color: #0b0b0b; }
  #prose { font-size: 14px; }
  #hint { font-size: 12px; color: #52514e; margin-top: 6px; }

"290" fill="transparent"/><text x="199.80582524271844" y="336" text-anchor="middle" class="tick">90</text><rect class="hit" data-budget="90" x="187.80582524271844" y="26" width="24" height="290" fill="transparent"/><text x="246.40776699029124" y="336" text-anchor="middle" class="tick">120</text><rect class="hit" data-budget="120" x="234.40776699029124" y="26" width="24" height="290" fill="transparent"/><text x="293.0097087378641" y="336" text-anchor="middle" class="tick">150</text><rect class="hit" data-budget="150" x="281.0097087378641" y="26" width="24" height="290" fill="transparent"/><text x="448.34951456310677" y="336" text-anchor="middle" class="tick">250</text><rect class="hit" data-budget="250" x="436.34951456310677" y="26" width="24" height="290" fill="transparent"/><text x="681.3592233009708" y="336" text-anchor="middle" class="tick">400</text><rect class="hit" data-budget="400" x="669.3592233009708" y="26" width="24" height="290" fill="transparent"/><rect id="cursor" x="0" y="26" width="24" height="290" fill="#0b0b0b" opacity="0" rx="6"/><text x="60" y="16" class="tick">error bars ±1 SE</text><text x="380.0" y="356" text-anchor="middle" class="tick">word budget</text><text x="14" y="171.0" text-anchor="middle" class="tick" transform="rotate(-90 14 171.0)">mean score (0–10)</text></svg>

<script>
const DATA = {"budgets": [5, 15, 30, 45, 60, 75, 90, 120, 150, 250, 400], "series": [{"label": "Sonnet 5", "color": "#2a78d6", "stats": {"5": [8.48236111111111, 0.06687926306106518], "15": [8.55800925925926, 0.07333260570191653], "30": [8.620138888888889, 0.06188881973724907], "45": [8.598703703703704, 0.06879362792942077], "60": [8.719120370370371, 0.06218227299422275], "75": [8.714398148148149, 0.06400586781335338], "90": [8.923425925925926, 0.05237853855275019], "120": [8.7075, 0.0656950924846896], "150": [8.752916666666666, 0.05873715200287744], "250": [8.899212962962963, 0.04985378409965259], "400": [8.88050925925926, 0.05101063964558483]}}, {"label": "gpt-oss-20b", "color": "#eb6834", "stats": {"5": [7.813611111111111, 0.08247626225632292], "15": [8.03912037037037, 0.08036653394025663], "30": [7.962083333333333, 0.10422592137505998]}}], "prose": {"5": {"score": 7.67, "text": "Bright pastel mint green"}, "15": {"score": 9.19, "text": "A soft, light mint green with a fresh, pale yellowish-green tint."}, "30": {"score": 7.67, "text": "A soft, light mint green with a fresh, minty quality \u2014 pale and airy, leaning slightly toward spring green, evoking new leaves or pastel seafoam."}, "45": {"score": 9.49, "text": "A soft, light mint green with a gentle yellow-green undertone \u2014 cool and fresh looking, somewhat like pale seafoam or a light jade. It's bright and airy rather than dark, with medium-high lightness and moderate saturation, evoking spring foliage or mint ice cream."}, "60": {"score": 8.83, "text": "A soft, bright mint green with a pale, fresh quality. It leans slightly toward spring green but stays cool, like the color of new leaves mixed with a touch of turquoise. It's light and airy rather than deep or dark, evoking pastel candy or a light seafoam shade with gentle luminosity."}, "75": {"score": 9.57, "text": "A soft, pale mint green with a fresh, airy quality. It's light and gentle, leaning slightly cool, reminiscent of sea foam or pale jade. The color feels bright but not intense\u2014like a diluted spring green mixed with white, giving it a soothing, pastel appearance often seen in soft candies or spring foliage."}, "90": {"score": 9.44, "text": "A soft, pale mint green with a fresh, cooling quality\u2014reminiscent of spearmint ice cream or new spring leaves. It leans slightly more green than blue, with a gentle yellow undertone keeping it bright rather than icy. The color is light and airy, not too saturated, giving it a soothing, pastel-like softness that feels fresh, clean, and slightly sweet, similar to a pale seafoam or light jade shade."}, "120": {"score": 7.67, "text": "A soft, bright mint green with a fresh, cool quality. Picture the pale green of new spring leaves mixed with a touch of aqua, giving it a slightly minty, almost turquoise undertone. It's light and airy rather than deep or dark \u2014 closer to a pastel than a saturated color, but still vivid enough to feel lively rather than washed out. Think of the color of mint ice cream, seafoam on a beach, or a pale jade gemstone. It sits between green and cyan on the color spectrum, leaning more green than blue, with a gentle, soothing, springtime feel overall."}, "150": {"score": 9.72, "text": "This is a soft, pale mint green \u2014 a light, airy color reminiscent of fresh spearmint leaves or a pale seafoam. It leans slightly cool, with a gentle blue undertone mixed into the green, giving it a refreshing, spa-like quality. The color is bright and light in value, not dark or muted, sitting somewhere between pastel and medium saturation \u2014 vivid enough to feel fresh and lively, but soft enough to feel calming rather than intense. Think of the color of mint ice cream, light jade, or a pale tropical ocean shallow. It's neither warm nor deeply cool, just a clean, gentle green with a touch of aqua brightness, evoking feelings of freshness, calm, and nature."}, "250": {"score": 9.5, "text": "Picture a soft, bright mint green \u2014 a pale, cool green with a gentle hint of aqua or seafoam running through it. It's fresh and light rather than dark or muted, sitting somewhere between the green of new spring leaves and the pale turquoise of shallow tropical water. The color reads as calm and airy, not intense or saturated like a pure green \u2014 think of a scoop of mint ice cream or a pastel candy in a soft green-blue hue. There's a slight coolness to it from the blue undertone, but green is clearly the dominant character. It's light enough to feel gentle and soothing, almost like a wash of pale color rather than a bold, deep tone, and would pair naturally with white, soft pinks, or pale blues in a fresh, breezy palette."}, "400": {"score": 9.24, "text": "This is a fresh, bright mint green with a light, airy quality to it.\n\nPicture a soft spring green that leans clearly toward the cool, blue-green side of the spectrum rather than toward yellow. It has strong saturation, so it's vivid and lively rather than muted or dusty, but it's also quite light and luminous, more pastel-adjacent than deep or dark. Think of the color of fresh mint leaves, sea foam, or a scoop of mint ice cream, cheerful and refreshing.\n\nIf you're mixing paint, start with a green and add a small amount of blue to push it toward turquoise territory, then add a good amount of white to lighten it and soften its intensity. The result should feel breezy and bright, almost glowing, like something you'd associate with tropical waters, spearmint candy, or pale jade stone."}}, "hex": "#95eabf"};
const cursor = document.getElementById("cursor");
const panel = document.getElementById("panel");
const scrollMore = document.getElementById("scroll-more");
const panelLabel = document.getElementById("panel-label");
const prose = document.getElementById("prose");

function activate(budget) {
  const hit = document.querySelector(`.hit[data-budget="${budget}"]`);
  cursor.setAttribute("x", parseFloat(hit.getAttribute("x")));
  cursor.setAttribute("opacity", "0.06");
  const p = DATA.prose[budget];
  const stats = DATA.series
    .filter(s => s.stats[budget])
    .map(s => `${s.label} ${s.stats[budget][0].toFixed(2)}`)
    .join(" · ");
  panelLabel.innerHTML = `<b>${budget}-word budget</b> · ${stats}` +
    (p ? ` · this description scored ${p.score.toFixed(1)}` : "");
  prose.textContent = p ? p.text : "No example description at this budget.";
  panel.scrollTop = 0;
  requestAnimationFrame(() => {
    scrollMore.style.display = panel.scrollHeight > panel.clientHeight + 4 ? "inline" : "none";
  });
}
for (const hit of document.querySelectorAll(".hit")) {
  const b = hit.dataset.budget;
  hit.addEventListener("pointerenter", () => activate(b));
  hit.addEventListener("click", () => activate(b));
}
activate(String(DATA.budgets[Math.floor(DATA.budgets.length / 2)]));
</script>
