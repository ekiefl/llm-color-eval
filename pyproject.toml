[project]
name = "color-guesser"
version = "0.1.0"
description = "Evaluation harness for describing colors in natural language and guessing them back"
readme = "README.md"
authors = [
    { name = "Evan Kiefl", email = "kiefl.evan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.12.1",
    "pydantic-ai-slim[anthropic,openai]>=2.37.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "typer>=0.27.2",
]

[project.scripts]
color-guesser = "color_guesser.cli:app"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
